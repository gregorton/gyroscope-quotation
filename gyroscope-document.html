<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gyroscope Technology — Quotation / Invoice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     GYROSCOPE TECHNOLOGY (GTi) — Quotation & Invoice template
     Print-ready. Set the DOC data object at the bottom of the
     file, then File ▸ Print ▸ Save as PDF (A4, Margins: Default,
     Background graphics: on). The CSS paginates across pages on its own.
     ============================================================ */

  :root {
    /* Three-step ink ramp on a navy/blue corporate axis, set in Inter — a close,
       cross-platform match to Apple's San Francisco. Navy carries the structure
       (headings, table head, values); blue is reserved for hyperlinks, the
       quotation number and the grand total, so it stays an accent. Slate and
       muted step the body copy and labels back. */
    --navy: #0F2540;      /* headings, doc title, table head, grand total, values */
    --blue: #0B57C7;      /* hyperlinks + quotation number + grand total value    */
    --teal: #0F2540;      /* legacy var — repointed to navy (disc, alt-label, apply, focus) */
    --slate: #3A4553;     /* secondary body text         */
    --muted: #5A6674;     /* field labels                */
    --hairline: #D8DEE7;  /* rules / borders             */
    --mist: #F4F6F9;      /* spec-box / panel background */
    --ink: #1F2733;       /* body copy                   */

    /* Inter — an open typeface designed as a close match to Apple's San
       Francisco (SF Pro). It's loaded as a web font (Google Fonts, above), so
       it renders identically on Windows, macOS, iPhone, Android and in PDF
       exports. -apple-system falls back to the real SF if Inter fails to load. */
    --brand-font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text',
                  'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #E8ECF2;
    color: var(--ink);
    font-family: var(--brand-font);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ---- Page sheet (A4) ---- */
  .sheet {
    width: 210mm;
    min-height: auto;
    margin: 16px auto;
    background: #fff;
    padding: 11mm 14mm 9mm;
    position: relative;
    box-shadow: 0 8px 32px rgba(15, 37, 64, 0.10);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Faint gyroscope watermark, like the reference */
  .sheet::before {
    content: "";
    position: absolute;
    right: -70mm;
    top: 95mm;
    width: 180mm;
    height: 180mm;
    background:
      radial-gradient(circle at center, rgba(15,37,64,0.035) 0 42%, transparent 43%),
      repeating-radial-gradient(circle at center, transparent 0 26mm, rgba(15,37,64,0.035) 26mm 26.4mm);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }

  .sheet > * { position: relative; z-index: 1; }

  /* ============ HEADER ============ */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    /* Subtle blue header band that bleeds to the sheet edges, closed off with a
       blue rule so it reads as an intentional masthead rather than a grey wash */
    background: #F7F9FC;
    border-bottom: 2px solid var(--blue);
    margin: -11mm -14mm 0;
    padding: 11mm 14mm 10mm;
  }

  .brand-lockup {
    display: flex;
    align-items: center;
    flex: 1 1 auto;
    min-width: 0;
  }
  .brand-logo {
    /* Constrained by HEIGHT so any logo aspect ratio behaves: the current
       circle-mark lockup is 1861x489 (≈3.81:1) where the previous wide
       lockup was 1844x320 (≈5.76:1). Fixing the height keeps the header
       band the same depth whichever asset is in place. */
    display: block;
    height: 18mm;
    width: auto;
    max-width: 96mm;
  }

  .company-contact {
    text-align: right;
    font-family: var(--brand-font);
    font-size: 13px;
    font-weight: 600;
    color: var(--slate);
    line-height: 1.5;
    min-width: 76mm;
    white-space: nowrap;
  }
  .company-contact .office {
    font-weight: 800;
    color: var(--blue);
    letter-spacing: 0.03em;
    font-size: 15.5px;
    margin-bottom: 4px;
  }
  .company-contact a { color: var(--blue); text-decoration: none; }
  .company-contact .lbl { display: inline-block; width: 40px; color: var(--muted); }

  /* Return-address line above the bill-to block */
  .return-line {
    font-size: 10px;
    color: var(--teal);
    border-bottom: 0.5px solid var(--hairline);
    padding-bottom: 3px;
    margin: 14px 0 8px;
    letter-spacing: 0.02em;
  }

  /* ============ ADDRESS + META ROW ============ */
  .addr-row {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    /* Divider rule where the return-address line used to be */
    margin-top: 14px;
    padding-top: 12px;
    border-top: 0.6px solid var(--hairline);
  }
  .bill-to { max-width: 84mm; }
  .bill-to .who { font-weight: 700; color: var(--navy); font-size: 13.5px; }
  .bill-to .line { color: var(--ink); }

  .doc-contact { font-size: 12px; min-width: 72mm; }
  .doc-contact .r { display: flex; gap: 8px; }
  .doc-contact .r .k { width: 92px; color: var(--muted); }
  .doc-contact .r .v { color: var(--navy); font-weight: 600; }
  .doc-contact .r .v a { color: var(--teal); text-decoration: none; }

  /* ============ DOC TITLE + META ============ */
  .doc-title {
    font-size: 23px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: -0.01em;
    margin: 14px 0 9px;
  }
  .doc-title .num { color: var(--blue); }

  .meta {
    font-size: 12px;
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 1px 12px;
    max-width: 108mm;
  }
  .meta .k { color: var(--muted); }
  .meta .k::after { content: " :"; }
  .meta .v { color: var(--navy); }
  .meta .v.b { font-weight: 700; }

  .lead {
    margin: 10px 0 4px;
    font-size: 12px;
    color: var(--slate);
  }

  /* ============ LINE ITEMS ============ */
  table.items {
    width: 100%;
    border-collapse: collapse;
    margin-top: 4px;
    font-size: 13px;
  }
  table.items thead th {
    text-align: left;
    color: var(--navy);
    font-weight: 700;
    border-bottom: 1px solid var(--navy);
    padding: 4px 6px 3px;
    vertical-align: bottom;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  table.items thead th.num { text-align: right; }
  table.items thead .cur {
    display: block;
    font-weight: 600;
    color: var(--muted);
    font-size: 11px;
  }

  .grp { border-bottom: 0.5px solid var(--hairline); position: relative; }
  .grp > td { padding: 3px 6px 5px; vertical-align: top; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Prices use the original brand font */
  table.items td.num, table.items thead th.num, table.items thead .cur,
  .up, .disc, .total-strong, table.totals {
    font-family: var(--brand-font);
  }
  .item-no { font-weight: 700; color: var(--navy); }
  .part { font-weight: 700; color: var(--navy); }
  .var { color: var(--muted); padding-left: 10px; font-weight: 500; }
  .desc-title { font-weight: 700; color: var(--navy); margin-top: 0; font-size: 13px; line-height: 1.32; }
  .desc { color: var(--ink); font-size: 13px; line-height: 1.32; }
  .desc .em { font-weight: 700; color: var(--navy); }
  .subline { color: var(--ink); font-size: 13px; line-height: 1.32; }
  .disc { color: var(--teal); font-weight: 600; }
  /* Per-line totals stay navy: the grand total is the only blue money on the page. */
  .total-strong { font-weight: 700; color: var(--navy); }

  /* Two-column label/value spec block, like the CS reference */
  .spec-box {
    margin: 4px 0 0;
    padding: 4px 12px;
    background: var(--mist);
    font-size: 12.5px;
    color: var(--slate);
    line-height: 1.35;
  }
  .spec-box.empty { display: none; }
  .spec-row {
    position: relative;
    display: grid;
    grid-template-columns: 46% 1fr;
    gap: 0 14px;
    align-items: baseline;
  }
  .spec-row .sk { color: var(--slate); }
  .spec-row .sv { color: var(--navy); font-weight: 600; }
  .spec-row .rm-spec { position: absolute; right: -22px; top: -1px; }

  .alt-label {
    font-style: italic;
    color: var(--teal);
    font-size: 11.5px;
    text-decoration: underline;
    padding: 4px 6px 0;
  }

  .link { color: var(--blue); text-decoration: none; font-weight: 600; }

  /* ---- Per-item attachments: datasheet link + image ---- */
  .attach { margin-top: 4px; }
  /* Attachment display is anchored to the *row* (not the cell) and pinned from
     the row's right edge. This keeps image + "Download PDF" under the price
     columns regardless of how wide the description cell happens to be. */
  .attach-out {
    position: absolute;
    top: 26px;
    right: 6px;
    width: 150px;
    text-align: right;
    overflow: hidden;
  }
  @media (max-width: 900px) {
    .attach-out { width: 120px; }
    .item-img { max-height: 72px; max-width: 120px; }
  }
  .ds-link {
    display: none;
    color: var(--blue);
    font-weight: 700;
    text-decoration: none;
  }
  .ds-link.on { display: block; }
  .ds-link:hover { text-decoration: underline; }
  .item-img {
    display: none;
    max-height: 92px;
    max-width: 150px;
    margin: 0 0 5px auto;
    object-fit: contain;
  }
  .item-img.on { display: block; }
  .att-editor { display: flex; gap: 7px; align-items: center; margin-top: 3px; }
  .att-editor .att-label {
    font-size: 9.5px; font-weight: 700; color: var(--muted);
    width: 78px; flex: none;
  }
  .att-input {
    font-family: inherit; font-size: 10.5px; color: var(--navy);
    padding: 3px 8px; border: 1px solid var(--hairline); border-radius: 5px;
    width: 240px; background: #fff;
  }
  .att-input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(15,37,64,0.12); }
  .apply {
    font-family: inherit; cursor: pointer; font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.03em; border: 0; border-radius: 999px;
    background: var(--teal); color: #fff; padding: 4px 12px;
  }
  .apply:hover { background: #1B3A5C; }

  /* ============ TOTALS ============ */
  .totals-wrap { display: flex; justify-content: flex-end; margin-top: 7px; }
  table.totals { width: 90mm; border-collapse: collapse; font-size: 12.5px; }
  table.totals td { padding: 3px 6px; }
  table.totals td.k { color: var(--slate); }
  table.totals td.v { text-align: right; font-variant-numeric: tabular-nums; color: var(--navy); }
  table.totals tr.rule td { border-top: 0.5px solid var(--hairline); }
  table.totals tr.grand td {
    border-top: 1px solid var(--navy);
    font-weight: 800;
    font-size: 15.5px;
    color: var(--navy);
    padding-top: 8px;
  }
  table.totals tr.grand td.v { color: var(--blue); }

  .terms {
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.55;
    max-width: 130mm;
  }
  .terms b { color: var(--navy); font-size: 13px; font-weight: 800; display: block; margin-bottom: 4px; }
  /* When the terms carry real content, set them off as a distinct section
     directly below the totals — a separator rule + spacing, not a whole new
     page (which left a big blank gap). Added by render() via .page-start. */
  .terms.page-start {
    margin-top: 20px;
    padding-top: 12px;
    border-top: 1px solid var(--hairline);
  }

  /* ============ FOOTER ============ */
  .foot {
    margin-top: 28px;
    padding-top: 6px;
    border-top: 0.5px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.55;
  }
  .foot .col b { color: var(--navy); display: block; font-size: 11px; font-weight: 800; margin-bottom: 2px; }
  .foot .col span { color: var(--ink); font-size: 11px; line-height: 1.5; }
  /* Accreditation badges, in the footer corner where the logo used to sit. */
  .foot .foot-certs {
    display: flex;
    align-items: center;
    gap: 10px;
    align-self: center;
    flex: none;
  }
  .foot .foot-certs svg {
    width: 46px;
    height: 46px;
    flex: none;
    shape-rendering: geometricPrecision;
    text-rendering: geometricPrecision;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ---- Screen-only toolbar ---- */
  .toolbar {
    max-width: 210mm;
    margin: 16px auto 0;
    display: flex;
    gap: 8px;
    align-items: center;
    font-family: inherit;
  }
  .toolbar button {
    background: var(--navy);
    color: #fff;
    border: 0;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .toolbar button.ghost { background: #fff; color: var(--navy); border: 1px solid var(--hairline); }
  .toolbar button.ghost:hover { background: #f3f6fa; }
  .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .toolbar button.danger { color: #b42318; border-color: #f1c2bd; }
  .toolbar button.danger:hover:not(:disabled) { background: #fef3f2; }
  .toolbar .hint { font-size: 11px; color: var(--slate); }
  .toolbar { flex-wrap: wrap; row-gap: 8px; }
  /* Grouped toolbar controls, divided by faint separators */
  .tb-group {
    display: inline-flex; align-items: center; gap: 6px;
    padding-left: 10px; margin-left: 2px;
    border-left: 1px solid var(--hairline);
  }
  .tb-label { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  .tb-select {
    font-family: inherit; font-size: 11px; font-weight: 600;
    padding: 8px 10px; border-radius: 999px; border: 1px solid var(--hairline);
    background: #fff; color: var(--navy); cursor: pointer; max-width: 220px;
  }
  .tb-select:hover { background: #f3f6fa; }

  /* ---- Editable fields: subtle affordance on screen, invisible in print ---- */
  [contenteditable="true"] { outline: none; border-radius: 2px; cursor: text; }
  @media screen {
    [contenteditable="true"]:hover  { background: rgba(15,37,64,0.07); box-shadow: 0 0 0 3px rgba(15,37,64,0.07); }
    [contenteditable="true"]:focus  { background: rgba(15,37,64,0.12); box-shadow: 0 0 0 3px rgba(15,37,64,0.12); }
  }
  /* Placeholder text for empty editable fields */
  [contenteditable][data-ph]:empty::before {
    content: attr(data-ph);
    color: #94a3b4;
    font-weight: 400;
    font-style: italic;
    pointer-events: none;
  }

  /* ---- Add / remove controls (screen only) ---- */
  .rm, .add { font-family: inherit; cursor: pointer; }
  .rm {
    border: 0; background: #ef4444; color: #fff;
    font-size: 13px; font-weight: 800; line-height: 1;
    width: 18px; height: 18px; padding: 0; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    vertical-align: middle; box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
  .rm:hover { background: #dc2626; transform: scale(1.1); }
  .rm-item {
    position: absolute; left: -26px; top: 5px;
    width: 20px; height: 20px; font-size: 14px;
  }
  .add {
    display: inline-block; margin-top: 0;
    border: 1px dashed var(--hairline); background: #fff; color: var(--teal);
    font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
    padding: 2px 9px; border-radius: 999px; line-height: 1.3;
  }
  .add:hover { border-color: var(--teal); background: rgba(15,37,64,0.06); }
  .add-item-wrap { margin-top: 8px; }
  .subline-row { display: flex; align-items: baseline; gap: 4px; margin-top: 0; }
  .subline-row .subline { flex: 1; }

  /* ---- Per-item editor chrome: collapsed until you work on the row ----
     The "+ detail line" / "+ spec row" buttons and the two attachment editors
     were always on screen, costing roughly 100px of dead height per line item.
     They now materialise on hover / keyboard focus for the row in hand only.
     All of it carries .no-print, so the export path strips it entirely. */
  .item-tools { display: flex; gap: 6px; align-items: center; margin-top: 3px; }
  .grp .item-tools,
  .grp .attach .att-editor { display: none; }
  .grp:hover .item-tools,
  .grp:focus-within .item-tools { display: flex; }
  .grp:hover .attach .att-editor,
  .grp:focus-within .attach .att-editor { display: flex; }

  /* .attach-out is absolutely positioned, so reserve height only when the row
     actually carries an image / datasheet link — otherwise a collapsed row
     would overlap the row beneath it. */
  .grp:has(.item-img.on) .attach { min-height: 98px; }
  .grp:has(.ds-link.on):not(:has(.item-img.on)) .attach { min-height: 20px; }

  /* Zebra striping aids scanning of multi-item quotes; kept barely-there.
     Declared before the hover affordance, at matching specificity, so hover wins. */
  table.items tbody tr.grp:nth-of-type(even) > td { background: #FBFCFE; }
  table.items tbody tr.grp:hover > td { background: #F7FAFC; }

  /* ---- Print pagination: fixed A4 pages built by the paginator ----
     #printRoot sits off-screen (measurable but invisible) until printing.
     Each .page is exactly one physical A4 sheet with its own margins, and
     the paginator only ever places whole blocks inside — so content can
     never be split across a page boundary. */
  #printRoot { position: absolute; left: -100000px; top: 0; width: 210mm; }
  .page {
    width: 210mm; height: 297mm; padding: 12mm 13mm;
    box-sizing: border-box; background: #fff; overflow: hidden; position: relative;
  }
  .page-body { height: 273mm; overflow: hidden; }
  /* Neutralise the on-screen header bleed inside a page, and never show
     placeholder hints in the printed copy. */
  .page .top { margin: 0 0 6mm !important; padding: 6mm 8mm; }
  .page [contenteditable][data-ph]:empty::before { content: "" !important; }
  .page [contenteditable="true"] { background: none !important; box-shadow: none !important; outline: none !important; }
  .page .terms-block { margin-top: 0; }
  .page .terms-block + .terms-block { margin-top: 9px; }

  @media print {
    html, body { background: #fff; }
    @page { size: A4; margin: 0; }   /* .page padding provides the margins */
    .no-print { display: none !important; }
    /* The hover affordance is an editing cue only — never ink it. */
    table.items tbody tr.grp:hover > td { background: none; }

    /* Paged mode (JS paginator ran): show the fixed pages, hide the sheet. */
    body.paged .toolbar,
    body.paged .sheet { display: none !important; }
    body.paged #printRoot { position: static; left: 0; width: auto; }
    body.paged .page { break-after: page; page-break-after: always; }
    body.paged .page:last-child { break-after: auto; page-break-after: auto; }

    /* Fallback (no JS / paginator failed): print the continuous sheet with
       margins and best-effort break rules, so printing still works. */
    body:not(.paged) #printRoot { display: none; }
    body:not(.paged) .toolbar { display: none; }
    body:not(.paged) .sheet {
      width: auto; min-height: auto; margin: 0; padding: 12mm 13mm;
      box-shadow: none; display: block; overflow: visible;
    }
    body:not(.paged) .sheet::before { display: none; }
    body:not(.paged) [contenteditable][data-ph]:empty::before { content: "" !important; }
    body:not(.paged) .top { margin: 0 0 6mm; padding: 6mm 8mm; }
    body:not(.paged) table.items thead { display: table-header-group; }
    body:not(.paged) tr.grp { break-inside: avoid; page-break-inside: avoid; }
    body:not(.paged) .addr-row, body:not(.paged) .doc-title,
    body:not(.paged) .meta, body:not(.paged) .totals-wrap { break-inside: avoid; }
    body:not(.paged) .foot-certs { break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()" title="Open the print dialog to save a PDF">Print / PDF</button>

  <span class="tb-group">
    <span class="tb-label">Saved</span>
    <select id="saveSelect" class="tb-select" onchange="onSelectSave()" title="Load one of your saved documents"></select>
    <button class="ghost" onclick="saveCurrent()" title="Save changes (Ctrl+S)">Save</button>
    <button class="ghost" onclick="saveAsNew()" title="Save the current document as a new named copy">Save As…</button>
    <button id="btnDelete" class="ghost danger" onclick="deleteSelectedSave()" title="Delete the selected save">Delete</button>
  </span>

  <span class="tb-group">
    <button class="ghost" onclick="exportData()" title="Download this document's data as a file you can import elsewhere">Export</button>
    <button class="ghost" onclick="exportAllData()" title="Download every saved document plus the current draft as one file — use this to move everything to another PC">Export All</button>
    <button class="ghost" onclick="document.getElementById('importFile').click()" title="Load data from an exported file or a bundle">Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden onchange="importData(this.files[0])">
    <button class="ghost" onclick="revertToOriginal()" title="Discard the working draft and reload the original (named saves are kept)">Revert</button>
  </span>

  <span class="tb-group">
    <button class="ghost" onclick="setDoc('quotation')">Quotation</button>
    <button class="ghost" onclick="setDoc('invoice')">Invoice</button>
  </span>

  <span id="saveStatus" class="hint" aria-live="polite"></span>
</div>

<div class="sheet" id="sheet">
  <!-- ============ HEADER ============ -->
  <div class="top">
    <div class="brand-lockup">
      <!-- normalizeHostedAssets() force-sets this src to GYRO_LOGO_URL on every
           render, load-from-save and import, so documents saved with an older
           logo URL silently upgrade to the current one. -->

const GYRO_ASSET_ROOTS = [
  'able instruments/',
  'applications/',

/**
 * Turn a local workspace path or a root-relative site path into the matching
 * public gyroinst.com URL. Unrelated third-party URLs stay untouched.
 */
function gyroAssetUrl(value) {
  const raw = String(value || '').trim();
  if (!raw || /^(?:data:|cid:)/i.test(raw)) return raw;

  if (/^https?:\/\/(?:www\.)?gyroinst\.com(?:\/|$)/i.test(raw)) {
    try {
      const url = new URL(raw);
      url.protocol = 'https:';
      url.hostname = 'gyroinst.com';
      return url.href;
    } catch (e) {
      return raw.replace(/^http:/i, 'https:').replace(/\/\/www\.gyroinst\.com/i, '//gyroinst.com');
    }
  }
  if (/^https?:/i.test(raw)) return raw;

  const path = raw.replace(/\\/g, '/').replace(/^file:\/+/i, '/');
  const cleanPath = path.split(/[?#]/, 1)[0];
  const filename = cleanPath.split('/').pop().toLowerCase();
  if (GYRO_ASSET_ALIASES[filename]) return GYRO_HOST + GYRO_ASSET_ALIASES[filename];

  const deployedPath = cleanPath.match(/(?:^|\/)(?:public|dist)\/(.+)$/i);
  if (deployedPath) return new URL('/' + deployedPath[1], GYRO_HOST).href;

  const lowerPath = cleanPath.toLowerCase().replace(/^\/+/, '');
  const rootIndex = GYRO_ASSET_ROOTS
    .map(root => ({ root, index: lowerPath.lastIndexOf(root) }))
    .filter(match => match.index >= 0)
    .sort((a, b) => b.index - a.index)[0];
  if (rootIndex) {
    const publicPath = cleanPath.replace(/^\/+/, '').slice(rootIndex.index);
    return new URL('/' + publicPath, GYRO_HOST).href;
  }

  return raw;
}

/** Line total = unit price × quantity, less any percentage discount. */
function lineTotal(unit, pcs, discPct) {
  const u = Number(unit) || 0;
  const q = pcs != null ? Number(pcs) : 1;
  const d = Number(discPct) || 0;
  return u * q * (1 - d / 100);
}

/* ---------------- document numbering ---------------- */
/* Numbers are generated from today's date as YYYY-MMDD (e.g. 2026-0706). Once
   generated for a document type it is cached, so re-renders (e.g. toggling
   Quotation/Invoice) keep the same number. The number stays editable — a
   manual edit is captured on the next render and preserved. */
const DOC_NUMS = {};        // { quotation: '2026-0706', invoice: '…' }

function pad(n, w) { return String(n).padStart(w, '0'); }

/** Date-based number: YYYY-MMDD, e.g. "2026-0706". */
function todayStamp() {
  const t = new Date();
  return `${t.getFullYear()}-${pad(t.getMonth() + 1, 2)}${pad(t.getDate(), 2)}`;
}

/** Human-readable today's date, e.g. "06 Jul 2026". */
function todayHuman() {
  const t = new Date();
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${pad(t.getDate(), 2)} ${m[t.getMonth()]} ${t.getFullYear()}`;
}

/** Auto number for a doc type, generated once then cached. */
function docNumber(type) {
  if (!DOC_NUMS[type]) DOC_NUMS[type] = todayStamp();
  return DOC_NUMS[type];
}

/** Parse a formatted money string back into a number. */
function parseNum(s) { return parseFloat(String(s).replace(/[^0-9.\-]/g, '')) || 0; }

/** Recalculate a single line's total from its unit price × pcs (− discount). */
function calcRow(row) {
  const unit = parseNum(row.querySelector('.up')?.textContent);
  const pcs = parseNum(row.querySelector('.pcs')?.textContent);
  const disc = parseNum(row.querySelector('.disc')?.textContent);
  const cell = row.querySelector('.total-strong');
  if (cell) cell.textContent = money(unit * pcs * (1 - disc / 100), '');
}

/** Number line items sequentially: 1.0, 2.0, 3.0 … */
function renumberItems() {
  document.querySelectorAll('#itemsBody tr.grp td.item-no > span')
    .forEach((el, i) => { el.textContent = (i + 1) + '.0'; });
}

/** Recalculate Net / VAT / Total from the (editable) line-item totals. */
function recompute() {
  const d = DOC, isInv = d.docType === 'invoice';
  let net = 0;
  document.querySelectorAll('#itemsBody tr.grp .total-strong')
    .forEach(el => { net += parseNum(el.textContent); });
  const vat = net * (d.vatPct / 100);
  const grand = net + vat;
  document.getElementById('totals').innerHTML = `
    <tr class="rule"><td class="k">Net total</td><td class="v">${money(net, d.currency)}</td></tr>
    <tr><td class="k">VAT ${d.vatPct}%</td><td class="v">${money(vat, d.currency)}</td></tr>
    <tr class="grand"><td class="k">${isInv ? 'Amount due' : 'Total incl. VAT'}</td><td class="v">${money(grand, d.currency)}</td></tr>`;
}

const itemsBodyEl = () => document.getElementById('itemsBody');
/* Storage keys are deliberately PATH-INDEPENDENT: earlier versions appended
   location.pathname, so moving the file to another folder made every save
   unreachable. migrateLegacyStorage() below adopts those older path-keyed
   entries once, at boot. */
const WORK_KEY  = 'gti_work_v2';         // refresh-safe working draft
const SAVES_KEY = 'gti_saves_v2';        // { id: { name, ts, html } }
const MIGRATED_KEY = 'gti_migrated_v2';  // marker so the scan runs only once
let currentSaveId = null;                // which named save is loaded (if any)

/* ---- small helpers ---- */
function sheetEl()  { return document.getElementById('sheet'); }
function normalizeHostedAssets(root = sheetEl()) {
  const logo = root.querySelector('.brand-logo');
  if (logo) logo.setAttribute('src', GYRO_LOGO_URL);

  root.querySelectorAll('img[src]').forEach(img => {
    const hosted = gyroAssetUrl(img.getAttribute('src'));
    if (hosted) img.setAttribute('src', hosted);
  });

  root.querySelectorAll('.attach').forEach(wrap => {
    const img = wrap.querySelector('.item-img');
    const imgInput = wrap.querySelector('.img-input');
    const imgSource = imgInput?.value || img?.getAttribute('src') || '';
    const hostedImage = gyroAssetUrl(imgSource);
    if (imgInput && hostedImage) imgInput.value = hostedImage;
    if (img && hostedImage) {
      img.setAttribute('src', hostedImage);
      img.classList.add('on');
    }

    const link = wrap.querySelector('.ds-link');
    const dsInput = wrap.querySelector('.ds-input');
    const pdfSource = dsInput?.value || link?.getAttribute('href') || '';
    const hostedPdf = gyroAssetUrl(pdfSource);
    if (dsInput && hostedPdf) dsInput.value = hostedPdf;
    if (link && hostedPdf) {
      link.setAttribute('href', hostedPdf);
      link.classList.add('on');
    }
  });
}
function sheetHTML(){ normalizeHostedAssets(); return sheetEl().innerHTML; }
function setSheetHTML(html) { sheetEl().innerHTML = html; normalizeHostedAssets(); recompute(); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function docLabel() {
  return (document.querySelector('#docTitle .num')?.textContent || '').trim() || 'Document';
}
function flashStatus(msg) {
  const el = document.getElementById('saveStatus');
  if (!el) return;
  el.textContent = msg;
  clearTimeout(flashStatus._t);
  flashStatus._t = setTimeout(() => { el.textContent = ''; }, 2500);
}

/* ---- working draft (autosave) ---- */
let _workTimer;
function saveWork() { try { localStorage.setItem(WORK_KEY, sheetHTML()); } catch (e) {} }
function autosave() { clearTimeout(_workTimer); _workTimer = setTimeout(saveWork, 500); }
function loadWork() {
  try { const h = localStorage.getItem(WORK_KEY); if (h) { setSheetHTML(h); return true; } } catch (e) {}
  return false;
}

/* ---- named saves ---- */
function readSaves()  { try { return JSON.parse(localStorage.getItem(SAVES_KEY) || '{}'); } catch (e) { return {}; } }
function writeSaves(o){ try { localStorage.setItem(SAVES_KEY, JSON.stringify(o)); } catch (e) {} }

/**
 * ONE-TIME adoption of saves written by older, path-keyed versions of this file
 * (e.g. 'gti_saves_/C:/Users/greg/Desktop/templates/gyroscope-document.html').
 * Legacy keys are NOT deleted — they stay as a safety net — and a marker key
 * stops the scan re-running. Entirely wrapped in try/catch: a quota error or a
 * malformed legacy blob must never stop the document from opening.
 */
function migrateLegacyStorage() {
  try {
    if (localStorage.getItem(MIGRATED_KEY)) return;

    const saves = readSaves();
    let adopted = 0;
    const legacyWork = [];

    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key) continue;

      if (key.indexOf('gti_saves_') === 0 && key !== SAVES_KEY) {
        let blob = null;
        try { blob = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { blob = null; }
        if (!blob || typeof blob !== 'object') continue;
        Object.keys(blob).forEach(id => {
          const entry = blob[id];
          if (!entry || typeof entry.html !== 'string') return;
          if (saves[id]) return;                       // already present — re-running is harmless
          saves[id] = { name: entry.name || 'Recovered document', ts: entry.ts || Date.now(), html: entry.html };
          adopted++;
        });
      } else if (key.indexOf('gti_work_') === 0 && key !== WORK_KEY) {
        legacyWork.push(key);
      }
    }

    if (adopted) writeSaves(saves);

    // Adopt a legacy working draft only when the new work slot is still empty.
    if (!localStorage.getItem(WORK_KEY) && legacyWork.length) {
      // No timestamp is stored with a working draft, so use the newest named
      // save from the same path as a recency proxy; ties fall back to scan order.
      let best = null;
      let bestTs = -1;
      legacyWork.forEach(key => {
        const suffix = key.slice('gti_work_'.length);
        let ts = 0;
        try {
          const sibling = JSON.parse(localStorage.getItem('gti_saves_' + suffix) || '{}');
          Object.keys(sibling).forEach(id => { ts = Math.max(ts, Number(sibling[id]?.ts) || 0); });
        } catch (e) {}
        if (ts >= bestTs) { bestTs = ts; best = key; }
      });
      const html = best ? localStorage.getItem(best) : null;
      if (html) localStorage.setItem(WORK_KEY, html);
    }

    localStorage.setItem(MIGRATED_KEY, new Date().toISOString());
    if (adopted) flashStatus('Recovered ' + adopted + ' saved document' + (adopted === 1 ? '' : 's'));
  } catch (e) { /* never block opening the document */ }
}

function refreshSaveDropdown() {
  const sel = document.getElementById('saveSelect');
  if (!sel) return;
  const saves = readSaves();
  const ids = Object.keys(saves).sort((a, b) => saves[b].ts - saves[a].ts);
  sel.innerHTML = '<option value="">— Unsaved draft —</option>'
    + ids.map(id => `<option value="${id}">${esc(saves[id].name)}</option>`).join('');
  sel.value = currentSaveId && saves[currentSaveId] ? currentSaveId : '';
  const del = document.getElementById('btnDelete');
  if (del) del.disabled = !sel.value;
}

function saveAsNew() {
  const saves = readSaves();
  const name = prompt('Save as — name this document:', docLabel());
  if (name == null) return;                        // cancelled
  const id = uid();
  saves[id] = { name: (name.trim() || docLabel()), ts: Date.now(), html: sheetHTML() };
  writeSaves(saves);
  currentSaveId = id;
  saveWork();
  refreshSaveDropdown();
  flashStatus('Saved "' + saves[id].name + '"');
}

function saveCurrent() {
  const saves = readSaves();
  if (currentSaveId && saves[currentSaveId]) {
    saves[currentSaveId].html = sheetHTML();
    saves[currentSaveId].ts = Date.now();
    writeSaves(saves);
    saveWork();
    flashStatus('Saved "' + saves[currentSaveId].name + '"');
  } else {
    saveAsNew();
  }
}

function onSelectSave() {
  const sel = document.getElementById('saveSelect');
  const id = sel.value;
  if (!id) { currentSaveId = null; refreshSaveDropdown(); return; }
  const saves = readSaves();
  if (!saves[id]) return;
  if (!confirm('Load "' + saves[id].name + '"?\nThe current view will be replaced (your other saves are kept).')) {
    sel.value = currentSaveId || '';
    return;
  }
  currentSaveId = id;
  setSheetHTML(saves[id].html);
  saveWork();
  refreshSaveDropdown();
  flashStatus('Loaded "' + saves[id].name + '"');
}

function deleteSelectedSave() {
  if (!currentSaveId) return;
  const saves = readSaves();
  const s = saves[currentSaveId];
  if (!s) return;
  if (!confirm('Delete saved document "' + s.name + '"? This cannot be undone.')) return;
  delete saves[currentSaveId];
  writeSaves(saves);
  currentSaveId = null;
  refreshSaveDropdown();
  flashStatus('Deleted "' + s.name + '"');
}

function revertToOriginal() {
  if (!confirm('Discard the current working draft and reload the original document?\nYour named saves are kept.')) return;
  try { localStorage.removeItem(WORK_KEY); } catch (e) {}
  currentSaveId = null;
  location.reload();
}

/* ---- export / import (portable JSON) ---- */
function exportData() {
  const name = (currentSaveId && readSaves()[currentSaveId]?.name) || docLabel();
  // Top-level `html` is kept at version 2 so an OLDER copy of this file, which
  // only looks for a string `html` field, can still import this export.
  const payload = { type: 'gyroscope-doc', version: 2, name, savedAt: new Date().toISOString(), html: sheetHTML() };
  downloadJSON(payload, (name.replace(/[^\w.-]+/g, '_') || 'document') + '.gti.json');
  flashStatus('Exported');
}

/**
 * EXPORT ALL — every named save plus the current working draft in one bundle.
 * localStorage never travels between machines, so this file is the only real
 * way to move a whole document library to another PC.
 */
function exportAllData() {
  const saves = readSaves();
  const documents = Object.keys(saves)
    .sort((a, b) => saves[b].ts - saves[a].ts)
    .map(id => ({ name: saves[id].name, ts: saves[id].ts, html: saves[id].html }));
  documents.unshift({ name: 'Working draft', ts: Date.now(), html: sheetHTML() });

  const payload = {
    type: 'gyroscope-doc-bundle',
    version: 2,
    savedAt: new Date().toISOString(),
    documents,
  };
  downloadJSON(payload, 'gyroscope-documents.gti.json');
  flashStatus('Exported ' + documents.length + ' document' + (documents.length === 1 ? '' : 's'));
}

function downloadJSON(payload, filename) {
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== 'object') throw new Error('bad file');

      // Multi-document bundle (EXPORT ALL): restore every document as a named save.
      if (Array.isArray(data.documents)) {
        const docs = data.documents.filter(d => d && typeof d.html === 'string');
        if (!docs.length) throw new Error('bad file');
        const saves = readSaves();
        let newest = null;
        docs.forEach((d, i) => {
          const id = uid() + i.toString(36);           // keep ids unique within the loop
          const ts = Number(d.ts) || Date.now();
          saves[id] = { name: d.name || 'Imported document', ts, html: d.html };
          if (!newest || ts > saves[newest].ts) newest = id;
        });
        writeSaves(saves);
        currentSaveId = newest;
        setSheetHTML(saves[newest].html);             // load the most recent one
        saveWork();
        refreshSaveDropdown();
        flashStatus('Imported ' + docs.length + ' document' + (docs.length === 1 ? '' : 's'));
        return;
      }

      // Single document: v1, v2, or a bare { html } object — anything with a
      // string `html` field is accepted, exactly as before.
      if (typeof data.html !== 'string') throw new Error('bad file');
      setSheetHTML(data.html);
      const saves = readSaves();
      const id = uid();
      const name = data.name || file.name.replace(/\.(gti\.)?json$/i, '');
      saves[id] = { name, ts: Date.now(), html: data.html };
      writeSaves(saves);
      currentSaveId = id;
      saveWork();
      refreshSaveDropdown();
      flashStatus('Imported "' + name + '"');
    } catch (e) {
      alert('Could not import that file — it is not a valid Gyroscope export.');
    }
  };
  reader.readAsText(file);
  const inp = document.getElementById('importFile');
  if (inp) inp.value = '';   // allow re-importing the same file
}

/* ---------------- boot ---------------- */
render();
migrateLegacyStorage();  // adopt saves from older path-keyed versions, once
loadWork();          // restore refresh-safe working draft over the fresh render
recompute();         // totals reflect the restored line items
refreshSaveDropdown();

/* ---------------- add / remove interactions ---------------- */

// Live totals + autosave: recalc the edited line, then re-sum the document.
document.addEventListener('input', (e) => {
  const row = e.target.closest('tr.grp');
  if (row && itemsBodyEl() && itemsBodyEl().contains(row)) {
    calcRow(row);
    recompute();
  }
  if (e.target.closest && e.target.closest('#sheet')) autosave();
});

// Autosave after any structural change made with the in-sheet buttons.
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b && b.closest('#sheet')) setTimeout(saveWork, 60);
});

// Ctrl/Cmd+S saves the current document.
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    saveCurrent();
  }
});

document.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;

  // Add a new blank line item
  if (btn.classList.contains('add-item')) {
    itemsBodyEl().insertAdjacentHTML('beforeend', itemHTML());
    renumberItems();
    recompute();
    return;
  }
  // Remove a line item
  if (btn.classList.contains('rm-item')) {
    btn.closest('tr.grp')?.remove();
    renumberItems();
    recompute();
    return;
  }
  // Add a detail line to this item's description
  if (btn.classList.contains('add-line')) {
    btn.closest('td').querySelector('.sublist')?.insertAdjacentHTML('beforeend', sublineHTML());
    return;
  }
  // Remove a detail line
  if (btn.classList.contains('rm-line')) {
    btn.closest('.subline-row')?.remove();
    return;
  }
  // Add a spec row
  if (btn.classList.contains('add-spec')) {
    const box = btn.closest('td').querySelector('.spec-box');
    box.classList.remove('empty');
    box.insertAdjacentHTML('beforeend', specHTML());
    return;
  }
  // Remove a spec row
  if (btn.classList.contains('rm-spec')) {
    const box = btn.closest('.spec-box');
    btn.closest('.spec-row')?.remove();
    if (box && !box.querySelector('.spec-row')) box.classList.add('empty');
    return;
  }
  // Apply a datasheet PDF link -> shows a "Download PDF" link (prints, editor doesn't)
  if (btn.classList.contains('ds-apply')) {
    const wrap = btn.closest('.attach');
    const input = wrap.querySelector('.ds-input');
    const url = gyroAssetUrl(input.value);
    input.value = url;
    const link = wrap.querySelector('.ds-link');
    if (url) {
      link.setAttribute('href', url);
      link.classList.add('on');
    } else {
      link.removeAttribute('href');
      link.classList.remove('on');
    }
    return;
  }
  // Apply an image link -> shows a thumbnail (prints, editor doesn't)
  if (btn.classList.contains('img-apply')) {
    const wrap = btn.closest('.attach');
    const input = wrap.querySelector('.img-input');
    const src = gyroAssetUrl(input.value);
    input.value = src;
    const img = wrap.querySelector('.item-img');
    if (src) { img.setAttribute('src', src); img.classList.add('on'); }
    else { img.removeAttribute('src'); img.classList.remove('on'); }
    return;
  }
});

// Paste as PLAIN TEXT everywhere, so copied content can't drag in stray
// fonts, sizes or colours that break the layout.
document.addEventListener('paste', (e) => {
  const el = e.target;
  if (el && el.isContentEditable) {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  }
});

// Press Enter inside an attachment field to apply it.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('att-input')) {
    e.preventDefault();
    e.target.closest('.att-editor').querySelector('.apply')?.click();
  }
});

/* ============================================================
   PRINT PAGINATOR — reflow the sheet into fixed A4 pages so no
   block is ever split across a page boundary. Runs only while
   printing; the on-screen editing sheet is left untouched.
   ============================================================ */
const HEADER_BLOCKS = ['.top', '.addr-row', '.doc-title', '.meta', '.lead'];

function stripControls(node) {
  node.querySelectorAll('.no-print').forEach(n => n.remove());
  return node;
}
function pgNewPage(root) {
  const page = document.createElement('div');
  page.className = 'page';
  const body = document.createElement('div');
  body.className = 'page-body';
  page.appendChild(body);
  root.appendChild(page);
  return body;
}
function pgFits(body) { return body.scrollHeight <= body.clientHeight + 1; }

/** Split the (possibly long) terms block into per-paragraph blocks. */
function pgTermsBlocks(termsEl) {
  const chunks = termsEl.innerHTML.split(/(?:<br\s*\/?>\s*){2,}/i)
    .map(s => s.trim()).filter(Boolean);
  return chunks.map(html => {
    const d = document.createElement('div');
    d.className = 'terms terms-block';
    d.innerHTML = html;
    return d;
  });
}

function buildPrintPages() {
  const src = document.getElementById('sheet');
  const root = document.getElementById('printRoot');
  if (!src || !root) return false;
  root.innerHTML = '';
  let body = pgNewPage(root);

  // Place a whole block; move it to a fresh page if it doesn't fit.
  const place = (node) => {
    body.appendChild(node);
    if (!pgFits(body) && body.childNodes.length > 1) {
      body.removeChild(node);
      body = pgNewPage(root);
      body.appendChild(node);
    }
  };

  // 1) header blocks
  HEADER_BLOCKS.forEach(sel => {
    const el = src.querySelector(sel);
    if (el) place(stripControls(el.cloneNode(true)));
  });

  // 2) line items — one table per page (column header repeats), rows kept whole
  const srcTable = src.querySelector('table.items');
  if (srcTable) {
    const theadHTML = srcTable.querySelector('thead') ? srcTable.querySelector('thead').outerHTML : '';
    let table = null, tbody = null;
    const startTable = () => {
      table = document.createElement('table');
      table.className = 'items';
      table.innerHTML = theadHTML + '<tbody></tbody>';
      tbody = table.querySelector('tbody');
      body.appendChild(table);
    };
    startTable();
    src.querySelectorAll('table.items tbody tr.grp').forEach(tr => {
      const row = stripControls(tr.cloneNode(true));
      tbody.appendChild(row);
      if (!pgFits(body) && tbody.children.length > 1) {
        tbody.removeChild(row);
        body = pgNewPage(root);
        startTable();
        tbody.appendChild(row);
      }
    });
    if (tbody && tbody.children.length === 0 && table) table.remove();
  }

  // 3) totals
  const totals = src.querySelector('.totals-wrap');
  if (totals) place(stripControls(totals.cloneNode(true)));

  // 4) terms (paragraph by paragraph)
  const terms = src.querySelector('.terms');
  if (terms && terms.textContent.trim()) {
    pgTermsBlocks(stripControls(terms.cloneNode(true))).forEach(place);
  }

  // 5) footer
  const foot = src.querySelector('.foot');
  if (foot) place(stripControls(foot.cloneNode(true)));

  return root.children.length > 0;
}

function preparePrint() {
  try {
    if (buildPrintPages()) document.body.classList.add('paged');
    else document.body.classList.remove('paged');
  } catch (e) {
    document.body.classList.remove('paged');   // fall back to continuous sheet
  }
}
function teardownPrint() {
  document.body.classList.remove('paged');
  const root = document.getElementById('printRoot');
  if (root) root.innerHTML = '';
}

window.addEventListener('beforeprint', preparePrint);
window.addEventListener('afterprint', teardownPrint);
// Safari / Firefox path (they may not fire before/afterprint reliably).
if (window.matchMedia) {
  const mq = window.matchMedia('print');
  const onChange = (m) => { if (m.matches) preparePrint(); else teardownPrint(); };
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange);
}
</script>
</body>
</html>
